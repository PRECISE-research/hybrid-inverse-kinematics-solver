name: Bug report
description: The solver crashes, rejects a valid setup file, or gives results that look wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not attach participant data.** Show the problem with one of the
        examples where possible, or with a short, deidentified excerpt.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: The command you ran and the setup file it used.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Full output
      description: Everything the tool printed, including any warnings.
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Tool version (printed in its banner), OpenSim version, and operating system.
      placeholder: "1.0.1, OpenSim 4.4, Windows 11"
    validations:
      required: true
